name: Daily Subscription Notifications

on:
  schedule:
    # Runs at 16:00 UTC every day, which is 23:00 Jakarta time (WIB, UTC+7)
    - cron: '0 16 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Call Next.js Cron Route
        # Automatically fails the action if the cURL request returns a non-200 status code
        run: |
          response=$(curl -s -w "%{http_code}" -X GET "${{ secrets.APP_URL }}/api/cron/subscription-notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Cron route failed with status $http_code"
            exit 1
          fi
